name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:static

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
