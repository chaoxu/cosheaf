name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COFLAT_REF: 18e8588c4885f29990d72acf037b33a2a9262f6b

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf check:static

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf build
      - run: pnpm --dir cosheaf build:server
