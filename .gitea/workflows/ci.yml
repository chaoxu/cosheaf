name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Coflat is unpinned: CI checks out its latest main. Set a 40-hex SHA to pin a run.
  COFLAT_REF: main

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install system build tools
        # The Forgejo runner image is minimal and lacks rsync, which Coflat's
        # build script invokes to stage its .d.ts/.d.mts files. GitHub-hosted
        # runners ship rsync; this runner does not, so install it explicitly.
        run: |
          command -v rsync >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y rsync
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf check:static

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install system build tools
        # The Forgejo runner image is minimal and lacks rsync, which Coflat's
        # build script invokes to stage its .d.ts/.d.mts files. GitHub-hosted
        # runners ship rsync; this runner does not, so install it explicitly.
        run: |
          command -v rsync >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y rsync
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install system build tools
        # The Forgejo runner image is minimal and lacks rsync, which Coflat's
        # build script invokes to stage its .d.ts/.d.mts files. GitHub-hosted
        # runners ship rsync; this runner does not, so install it explicitly.
        run: |
          command -v rsync >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y rsync
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf build
      - run: pnpm --dir cosheaf build:server

  sync-github:
    name: Sync to GitHub
    runs-on: ubuntu-latest
    needs: [static, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
          fetch-depth: 0
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.COSHEAF_GITHUB_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Run GitHub Mirror Sync
        env:
          GITHUB_REPO: chaoxu/cosheaf
        run: ./cosheaf/scripts/mirror-github.sh --yes
