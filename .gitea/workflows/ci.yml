name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COFLAT_REF: e0c851825e95eaffc28b5a062b38c4d4da2140c9

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install system build tools
        # The Forgejo runner image is minimal and lacks rsync, which Coflat's
        # build script invokes to stage its .d.ts/.d.mts files. GitHub-hosted
        # runners ship rsync; this runner does not, so install it explicitly.
        run: |
          command -v rsync >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y rsync
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf check:static

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install system build tools
        # The Forgejo runner image is minimal and lacks rsync, which Coflat's
        # build script invokes to stage its .d.ts/.d.mts files. GitHub-hosted
        # runners ship rsync; this runner does not, so install it explicitly.
        run: |
          command -v rsync >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y rsync
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf
      - name: Check out Coflat
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat
          ref: ${{ env.COFLAT_REF }}
          path: coflat
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version
      - name: Install system build tools
        # The Forgejo runner image is minimal and lacks rsync, which Coflat's
        # build script invokes to stage its .d.ts/.d.mts files. GitHub-hosted
        # runners ship rsync; this runner does not, so install it explicitly.
        run: |
          command -v rsync >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y rsync
      - name: Install and build Coflat
        run: |
          pnpm --dir coflat install --frozen-lockfile
          pnpm --dir coflat build
      - run: pnpm --dir cosheaf install --frozen-lockfile
      - run: pnpm --dir cosheaf build
      - run: pnpm --dir cosheaf build:server
