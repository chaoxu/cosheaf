name: Branch preview cleanup

on:
  delete: {}
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to clean up
        required: true
      delete_volume:
        description: Delete preview SQLite volume
        required: false
        default: "true"

jobs:
  cleanup:
    name: Remove branch preview
    runs-on: host
    timeout-minutes: 10

    steps:
      - name: Checkout cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf

      - name: Remove preview resources with shared helper
        working-directory: cosheaf
        run: |
          branch="${{ github.event.inputs.branch }}"
          if [ -z "$branch" ]; then
            branch="${GITHUB_REF_NAME}"
          fi
          if [ -z "$branch" ]; then
            echo "missing branch name"
            exit 1
          fi

          slug="$(node scripts/preview-state.mjs slug "$branch")"
          keep_volume=""
          delete_volume="${{ github.event.inputs.delete_volume }}"
          if [ "$delete_volume" = "false" ]; then
            keep_volume="--keep-volume"
          fi

          COSHEAF_PREVIEW_STATE_SCRIPT="$PWD/scripts/preview-state.mjs" \
            bash scripts/jupiter-preview-host.sh clean-local "$branch" "" "$slug" 3100 3199 "$keep_volume"

          echo "removed preview for $branch"
