name: Deploy to jupiter

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy (prod)
    runs-on: host
    timeout-minutes: 30

    steps:
      - name: Checkout cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf

      - name: Show workspace layout
        run: ls -la

      - name: Setup pnpm
        run: |
          pnpm_home="${RUNNER_TEMP:-$PWD/.tmp-ci}/pnpm"
          npm install -g --prefix "$pnpm_home" pnpm@10.33.0
          echo "$pnpm_home/bin" >> "$GITHUB_PATH"
          "$pnpm_home/bin/pnpm" --version

      - name: Install release dependencies
        working-directory: cosheaf
        run: pnpm install --frozen-lockfile

      - name: Build, start, and verify prod
        working-directory: cosheaf
        env:
          COSHEAF_DOCKER_NO_SUDO: "1"
        run: node scripts/jupiter-release.mjs release prod

      - name: Write Caddy snippet
        run: |
          tee /etc/caddy/sites.d/cosheaf.caddy > /dev/null <<'EOF'
          # Generated by cosheaf/.gitea/workflows/deploy.yml.
          https://cosheaf.lab {
              tls internal
              reverse_proxy 127.0.0.1:3030
          }
          EOF
          sudo -n /usr/bin/systemctl reload caddy

      - name: Smoke test through Caddy
        run: |
          curl -k -sS -o /dev/null -w "via caddy: http=%{http_code}\n" https://cosheaf.lab/api/v1/health
