name: Deploy to jupiter

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy (prod)
    runs-on: host
    timeout-minutes: 30

    steps:
      - name: Checkout cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf

      - name: Checkout coflat-editor (sibling needed by Dockerfile)
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat-editor
          path: coflat-editor
          token: ${{ secrets.GIT_PAT }}

      - name: Show workspace layout
        run: ls -la

      - name: Pull in persistent env file if present
        run: |
          if [ -f /srv/cosheaf/.env.prod ]; then
            cp /srv/cosheaf/.env.prod cosheaf/.env.prod
          fi

      - name: Build and start prod
        working-directory: cosheaf
        run: docker compose --profile prod up -d --build

      - name: Wait for container health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3030/api/v1/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed after 60s"
          docker logs cosheaf-prod --tail 80 || true
          exit 1

      - name: Write Caddy snippet
        run: |
          tee /etc/caddy/sites.d/cosheaf.caddy > /dev/null <<'EOF'
          # Generated by cosheaf/.gitea/workflows/deploy.yml.
          https://cosheaf.lab {
              tls internal
              reverse_proxy 127.0.0.1:3030
          }
          EOF
          sudo -n /usr/bin/systemctl reload caddy

      - name: Smoke test through Caddy
        run: |
          curl -sS -o /dev/null -w "via caddy: http=%{http_code}\n" https://cosheaf.lab/api/v1/health
