name: Branch preview

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  preview:
    name: Build branch preview
    runs-on: host
    timeout-minutes: 30

    steps:
      - name: Checkout cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf

      - name: Checkout coflat-editor
        uses: actions/checkout@v4
        with:
          repository: chaoxu/coflat-editor
          path: coflat-editor
          token: ${{ secrets.GIT_PAT }}

      - name: Compute preview name
        id: preview
        working-directory: cosheaf
        run: |
          branch="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          slug="$(printf '%s' "$branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-40)"
          if [ -z "$slug" ]; then
            slug="branch"
          fi
          hash="$(printf '%s' "$branch" | cksum | awk '{print $1}')"
          port=$((3100 + (hash % 200)))
          {
            echo "branch=$branch"
            echo "slug=$slug"
            echo "port=$port"
            echo "container=cosheaf-preview-$slug"
            echo "volume=cosheaf-preview-$slug-data"
            echo "image=cosheaf-preview:$slug"
          } >> "$GITHUB_OUTPUT"
          echo "preview slug=$slug port=$port"

      - name: Build preview image
        run: |
          node cosheaf/scripts/prepare-coflat-editor-package.mjs
          docker build \
            -f cosheaf/Dockerfile \
            -t "${{ steps.preview.outputs.image }}" \
            .

      - name: Start preview container
        run: |
          env_file=/srv/cosheaf/.env.preview
          if [ ! -f "$env_file" ]; then
            env_file=/srv/cosheaf/.env.prod
          fi
          if [ ! -f "$env_file" ]; then
            echo "missing /srv/cosheaf/.env.preview or /srv/cosheaf/.env.prod"
            exit 1
          fi

          docker rm -f "${{ steps.preview.outputs.container }}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${{ steps.preview.outputs.container }}" \
            --restart unless-stopped \
            --env-file "$env_file" \
            -e COSHEAF_SERVER_URL="https://cosheaf-${{ steps.preview.outputs.slug }}.lab" \
            -e COSHEAF_WEBHOOK_URL="http://100.93.22.80:${{ steps.preview.outputs.port }}/api/v1/webhooks/forgejo" \
            -v "${{ steps.preview.outputs.volume }}:/var/lib/cosheaf" \
            -p "127.0.0.1:${{ steps.preview.outputs.port }}:3030" \
            -p "100.93.22.80:${{ steps.preview.outputs.port }}:3030" \
            "${{ steps.preview.outputs.image }}"

      - name: Write Caddy preview route
        run: |
          sudo tee "/etc/caddy/sites.d/cosheaf-preview-${{ steps.preview.outputs.slug }}.caddy" > /dev/null <<EOF
          # Generated by cosheaf/.gitea/workflows/preview.yml for ${{ steps.preview.outputs.branch }}.
          https://cosheaf-${{ steps.preview.outputs.slug }}.lab {
              tls internal
              reverse_proxy 127.0.0.1:${{ steps.preview.outputs.port }}
          }
          EOF
          sudo -n /usr/bin/systemctl reload caddy

      - name: Health check
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${{ steps.preview.outputs.port }}/api/v1/health" >/dev/null; then
              echo "preview ready: https://cosheaf-${{ steps.preview.outputs.slug }}.lab"
              echo "direct port: http://jupiter:${{ steps.preview.outputs.port }}"
              exit 0
            fi
            sleep 1
          done
          docker logs "${{ steps.preview.outputs.container }}" --tail 100 || true
          exit 1
