name: Branch preview

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  preview:
    name: Build branch preview
    runs-on: host
    timeout-minutes: 30

    steps:
      - name: Checkout cosheaf
        uses: actions/checkout@v4
        with:
          path: cosheaf

      - name: Deploy preview with shared helper
        working-directory: cosheaf
        run: |
          branch="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          slug="$(node scripts/preview-state.mjs slug "$branch")"
          archive="/tmp/cosheaf-preview-${slug}.tar"

          git archive --format=tar -o "$archive" HEAD
          COSHEAF_PREVIEW_STATE_SCRIPT="$PWD/scripts/preview-state.mjs" \
            bash scripts/jupiter-preview-host.sh deploy-local "$branch" "$sha" "$slug" 3100 3199

          echo "preview ready: https://cosheaf-${slug}.lab"
