services:
  cosheaf-preview:
    build:
      context: ..
      dockerfile: cosheaf/Dockerfile
      args:
        COSHEAF_GIT_SHA: ${COSHEAF_GIT_SHA:-unknown}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    image: cosheaf-preview:${COSHEAF_PREVIEW_SLUG}
    container_name: cosheaf-preview-${COSHEAF_PREVIEW_SLUG}
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      fleet.preview: "true"
      fleet.app: cosheaf
      fleet.kind: preview
      fleet.source.ref: ${COSHEAF_PREVIEW_BRANCH}
      fleet.source.sha: ${COSHEAF_GIT_SHA:-unknown}
      fleet.expires_at: ${COSHEAF_PREVIEW_EXPIRES_AT}
      fleet.caddy: /etc/caddy/sites.d/cosheaf-preview-${COSHEAF_PREVIEW_SLUG}.caddy
    env_file:
      - path: ${COSHEAF_ENV_DIR:-/srv/cosheaf}/.env.prod
        required: false
    environment:
      COSHEAF_PORT: "3030"
      COSHEAF_DATA_DIR: /var/lib/cosheaf
      COSHEAF_GIT_SHA: ${COSHEAF_GIT_SHA:-unknown}
      COSHEAF_SERVER_URL: https://cosheaf-${COSHEAF_PREVIEW_SLUG}.lab
      COSHEAF_WEBHOOK_URL: http://${JUPITER_TAILSCALE_IP:-100.93.22.80}:${COSHEAF_PREVIEW_PORT}/api/v1/webhooks/forgejo
    ports:
      - "127.0.0.1:${COSHEAF_PREVIEW_PORT}:3030"
      - "${JUPITER_TAILSCALE_IP:-100.93.22.80}:${COSHEAF_PREVIEW_PORT}:3030"
    volumes:
      - cosheaf-preview-data:/var/lib/cosheaf
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3030/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cosheaf-preview-data:
    name: cosheaf-preview-${COSHEAF_PREVIEW_SLUG}-data
    labels:
      fleet.preview: "true"
      fleet.app: cosheaf
      fleet.kind: preview
      fleet.source.ref: ${COSHEAF_PREVIEW_BRANCH}
      fleet.source.sha: ${COSHEAF_GIT_SHA:-unknown}
      fleet.expires_at: ${COSHEAF_PREVIEW_EXPIRES_AT}
