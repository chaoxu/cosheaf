x-cosheaf-app: &cosheaf-app
  build:
    context: ..
    dockerfile: cosheaf/Dockerfile
    args:
      COSHEAF_GIT_SHA: ${COSHEAF_GIT_SHA:-unknown}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
  image: cosheaf:local
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  environment:
    COSHEAF_PORT: "3030"
    COSHEAF_DATA_DIR: /var/lib/cosheaf
    COSHEAF_GIT_SHA: ${COSHEAF_GIT_SHA:-unknown}
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3030/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  cosheaf-prod:
    <<: *cosheaf-app
    profiles: ["prod"]
    container_name: cosheaf-prod
    env_file:
      - path: ${COSHEAF_ENV_DIR:-/srv/cosheaf}/.env.prod
        required: false
    ports:
      - "${COSHEAF_PROD_PORT:-3030}:3030"
    volumes:
      - cosheaf-prod-data:/var/lib/cosheaf

volumes:
  cosheaf-prod-data:
