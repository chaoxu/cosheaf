services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.1
    container_name: forgejo-cosheaf
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "100.93.22.80:3002:3000"
      - "192.168.1.108:3002:3000"
    volumes:
      - /srv/forgejo/data:/data:Z
